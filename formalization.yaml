fidelity:
  divergences: >-
    These are restricted realization theorems and an extension principle, not
    a proof of the unrestricted binary X-ray conjecture. Definitions use
    zero-based Fin indices with one-based antidiagonal labels. The extension
    is compared as a multiset, so its slot order is immaterial. The selected
    extension statements assert existence and a conditional cardinality inequality,
    without specifying a pointwise extension of a prescribed permutation. All definitions
    are explicit in Challenge.lean; the comparison has no definition holes.
