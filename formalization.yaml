status:
  scope: >-
    All eight principal statements in Challenge.lean are proved in Solution.lean.
    The lower one-sided proof additionally retains its minimum edge. Ranked-cell
    realizability is proved equivalent to literal permutation-matrix labels.
    The example deviation words in PROOF.md are informal consequences; no
    finite census is a premise. The unrestricted conjecture is not proved.
